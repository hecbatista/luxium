org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# Metallum turns this off too: IntelliJ isn't fully compatible with it yet (FabricMC/fabric-loom#1349).
org.gradle.configuration-cache=false

# Versions copied from references/metallum/gradle.properties, so both mods build against the same game.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.16-SNAPSHOT
sodium_version=mc26.3-0.9.2-fabric

# Metallum is built from references/metallum (commit 467d312, version string 0.0.25).
# Build it first: cd ../references/metallum && ./gradlew build
metallum_version=0.0.25

mod_version=0.0.1
maven_group=io.github.hecbatista.metalshaders
