plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	// Sodium comes from Modrinth's Maven, the same way Metallum gets it.
	maven { url "https://api.modrinth.com/maven" }
}

// The Metallum jar we built and tested locally (see gradle.properties).
def metallumJar = file("../references/metallum/build/libs/metallum-${project.metallum_version}.jar")

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
	implementation files(metallumJar)

	// JCPP evaluates #if/#define. Its own dependencies (Ant, jopt-simple, annotations) are only
	// for its command-line tool; slf4j, which it does need, already comes with Minecraft.
	implementation("org.anarres:jcpp:${project.jcpp_version}") { transitive = false }
	include("org.anarres:jcpp:${project.jcpp_version}")

	// Tests for the parts that don't need the game running (pack reading, later the translator).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat "full"
		showStandardStreams = true
	}
	// RealPackTest reads whatever packs are in run/shaderpacks/, so it must rerun when they change.
	inputs.dir("run/shaderpacks").optional().withPropertyName("shaderpacks")
}

// Client game tests (docs.fabricmc.net/develop/automatic-testing): `./gradlew runClientGameTest`
// starts the game, runs src/gametest's tests (load a world, teleport, take screenshots) and quits.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "metalshaders-test"
		enableGameTests = false        // server-side game tests: not needed
		enableClientGameTests = true
		eula = true                    // the user agreed to the Minecraft EULA on 2026-11-20
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Fail early, with a clear message, if Metallum hasn't been built yet.
tasks.named("compileJava") {
	doFirst {
		if (!metallumJar.exists()) {
			throw new GradleException("Missing ${metallumJar}. Build Metallum first: cd ../references/metallum && ./gradlew build")
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Ship the third-party credits inside the mod jar.
jar {
	from("NOTICE")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
