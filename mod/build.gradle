plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	// Sodium comes from Modrinth's Maven, the same way Metallum gets it.
	maven { url "https://api.modrinth.com/maven" }
	// Mod Menu's API, for its optional "Configure" button (compile only: never needed at run time).
	maven {
		url "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

// The Metallum jar we built and tested locally (see gradle.properties).
// LUXIUM_METALLUM_JAR=<path> runs against another one instead, e.g. Modrinth's metallum-mc
// release, which is what players install (docs/release/alpha.md).
def metallumJar = System.getenv("LUXIUM_METALLUM_JAR") != null
		? file(System.getenv("LUXIUM_METALLUM_JAR"))
		: file("../references/metallum/build/libs/metallum-${project.metallum_version}.jar")

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
	implementation files(metallumJar)
	// Metallum's Metal bindings (nested in its jar, so present at run time). Step 7g calls
	// MTLDevice.newLibraryWithSource on the compile pool to warm Metal's shader cache.
	compileOnly "io.github.kokodio:metal-jvm:${project.metal_jvm_version}"
	// Mod Menu (optional): its "modmenu" entrypoint opens the Shader Packs screen. Compile only, so
	// Luxium runs without Mod Menu (and without Fabric API, which Mod Menu needs).
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	// JCPP evaluates #if/#define. Its own dependencies (Ant, jopt-simple, annotations) are only
	// for its command-line tool; slf4j, which it does need, already comes with Minecraft.
	implementation("org.anarres:jcpp:${project.jcpp_version}") { transitive = false }
	include("org.anarres:jcpp:${project.jcpp_version}")

	// Tests for the parts that don't need the game running (pack reading, later the translator).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat "full"
		showStandardStreams = true
	}
	// RealPackTest reads whatever packs are in run/shaderpacks/, so it must rerun when they change.
	inputs.dir("run/shaderpacks").optional().withPropertyName("shaderpacks")
}

// The multi-pack scoreboard (PackCorpusTest): every pack in run/shaderpacks/ and run/testpacks/*/
// through every stage that runs without the game, written to build/corpus/scoreboard.md. Fetch the
// test packs first with scripts/fetch-testpacks.sh. LUXIUM_TEST_PACKS=<dir> limits it to that folder.
tasks.register("packCorpus", Test) {
	description = "Scores every shader pack in run/shaderpacks/ and run/testpacks/."
	group = "verification"
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching "*.PackCorpusTest" }
	systemProperty "luxium.corpus", "true"
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat "full"
		showStandardStreams = true
	}
	outputs.upToDateWhen { false }
}

// Client game tests (docs.fabricmc.net/develop/automatic-testing): `./gradlew runClientGameTest`
// starts the game, runs src/gametest's tests (load a world, teleport, take screenshots) and quits.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "luxium-test"
		enableGameTests = false        // server-side game tests: not needed
		enableClientGameTests = true
		eula = true                    // the user agreed to the Minecraft EULA on 2026-11-20
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	gametestCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	// LUXIUM_TEST_MODMENU=1: run the game tests with Mod Menu installed (menus slice D).
	if (System.getenv("LUXIUM_TEST_MODMENU") != null) {
		gametestRuntimeOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	}
}

// LUXIUM_GPU_LABELS=1: start the game with --renderDebugLabels (Minecraft's Main), so Metallum labels
// its command buffers and encoders (MetalDevice.useLabels) and Metal System Trace shows pass names.
// For profiling only; off by default (labels cost CPU).
loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
	if (System.getenv('LUXIUM_GPU_LABELS') != null) {
		programArgs '--renderDebugLabels'
	}
	// LUXIUM_JVM_ARGS: extra JVM options for the game (for example -Xlog:gc), space-separated. Profiling only.
	if (System.getenv('LUXIUM_JVM_ARGS') != null) {
		vmArgs(System.getenv('LUXIUM_JVM_ARGS').trim().split(/\s+/))
	}
}

// Fail early, with a clear message, if Metallum hasn't been built yet.
tasks.named("compileJava") {
	doFirst {
		if (!metallumJar.exists()) {
			throw new GradleException("Missing ${metallumJar}. Build Metallum first: cd ../references/metallum && ./gradlew build")
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Ship Luxium's license (LGPL-3.0-only, repo root) and the third-party credits inside the mod jar.
jar {
	from("NOTICE")
	from("../LICENSE")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
