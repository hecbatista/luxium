// Runs the same PlaytestTour as mod/, but with Iris (OpenGL) instead of Luxium + Metallum, so the
// screenshots can be compared side by side. No Luxium or Metallum classes are on the classpath.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
	implementation "maven.modrinth:iris:${project.iris_version}"
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "iris-compare-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true                    // the user agreed to the Minecraft EULA on 2026-11-20
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	gametestImplementation "maven.modrinth:iris:${project.iris_version}"
}

// The tour itself is shared with mod/: one file, not a copy.
sourceSets {
	gametest {
		java {
			srcDir "../mod/src/gametest/java"
			include "io/github/hecbatista/metalshaders/test/PlaytestTour.java"
			include "iriscompare/**"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
